name: Build KeyframeTool DLL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build DLL
        run: dotnet build KeyframeTool.csproj -c Release

      - name: Upload Compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: KeyframeTool-Release
          path: bin/Release/net35/KeyframeTool.dll
